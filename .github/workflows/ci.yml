name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yoikiji?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yoikiji?schema=public
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yoikiji?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yoikiji?schema=public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/yoikiji?schema=public
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/yoikiji?schema=public
          APP_SECRET: ci-only-secret-with-at-least-32-characters
          NEXT_PUBLIC_SITE_URL: https://example.invalid
